name: Build TRR Qt Trainer Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Display version (for example 0.0.00)
        required: true
        default: 0.0.00
  push:
    tags:
      - "trr-v*"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve build metadata
        id: metadata
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^trr-v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.0.00"
          }
          $commitSha = (git rev-parse HEAD).Trim()
          $shortSha = $commitSha.Substring(0, 8)
          $releaseTag = "trr-v$version"

          "TRR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TRR_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit_sha=$commitSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 `
            "-DTRR_VERSION=$env:TRR_VERSION" `
            "-DTRR_BUILD_NUMBER=${{ github.run_number }}" `
            "-DTRR_COMMIT_SHA=$env:TRR_SHORT_SHA" `
            "-DTRR_BUILD_CHANNEL=release" `
            "-DTRR_BUILD_BRANCH=main"
          cmake --build build-ci --config Release --parallel

      - name: Package portable application
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = (git rev-parse --short=8 HEAD).Trim()
          $packageBase = "trr-qt-trainer-$env:TRR_VERSION-${{ github.run_number }}-$shortSha-win64"
          $stagingDir = Join-Path $env:RUNNER_TEMP $packageBase
          $binDir = Join-Path $stagingDir "bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $exePath = Join-Path $env:GITHUB_WORKSPACE "build-ci\Release\trr_qt_trainer.exe"
          Copy-Item $exePath $binDir
          windeployqt --release --compiler-runtime --dir $binDir (Join-Path $binDir "trr_qt_trainer.exe")

          Copy-Item assets, presets -Destination $stagingDir -Recurse -Force
          Copy-Item README.md, README_AUTOMATION.md -Destination $stagingDir -Force

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zipPath = Join-Path release "$packageBase.zip"
          Compress-Archive -Path (Join-Path $stagingDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          $hashPath = "$zipPath.sha256"
          (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content $hashPath -NoNewline

          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hashPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: trr-qt-trainer-windows-release
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: TRR Qt Trainer ${{ steps.metadata.outputs.version }}
          target_commitish: ${{ steps.metadata.outputs.commit_sha }}
          draft: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          generate_release_notes: true

      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });
